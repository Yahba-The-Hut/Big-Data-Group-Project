# Member 2: Kafka topic2 -> Elasticsearch index gp1-entities
#
# Runs inside the Kafka container's network (see docker-compose.elastic.yml),
# so localhost:9092 reaches Kafka and host.docker.internal:9200 reaches
# Elasticsearch.

input {
  kafka {
    bootstrap_servers => "localhost:9092"
    topics => ["topic2"]
    group_id => "gp1-entity-logstash"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  mutate {
    lowercase => ["entity"]
    remove_field => ["event", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://host.docker.internal:9200"]
    index => "gp1-entities"
    # One document per entity: each new cumulative count REPLACES the old one,
    # so the chart never double-counts.
    document_id => "%{entity}"
    action => "index"
  }
  stdout { codec => rubydebug }
}