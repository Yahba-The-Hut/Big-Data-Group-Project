# Member 2: Elasticsearch + Kibana + Logstash for the entity chart.
#
# Prerequisite: Member 1's Kafka container named "kafka" is already running
# (docker start kafka). Logstash joins that container's network so it can
# reach Kafka at localhost:9092 without changing Kafka's config.
#
# Start:  docker compose -f docker-compose.elastic.yml up -d
# Stop:   docker compose -f docker-compose.elastic.yml down
#
# Security is disabled: local demo only, never expose these ports publicly.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.1.0}
    container_name: gp1-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.1.0}
    container_name: gp1-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-9.1.0}
    container_name: gp1-logstash
    # Shares the Kafka container's network: localhost:9092 = Kafka.
    # Docker Desktop resolves host.docker.internal to the host, where
    # Elasticsearch's port 9200 is published.
    network_mode: "container:kafka"
    environment:
      - xpack.monitoring.enabled=false
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

volumes:
  esdata: